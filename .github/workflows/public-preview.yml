name: Public informational preview
on:
  push:
    branches: [public-preview]
  pull_request:
    branches: [public-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: node --test preview-site/build.test.mjs
      - run: node preview-site/build.mjs && node preview-site/build.mjs --check
      - name: Upload only the verified informational site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/public-preview'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out-preview/

  deploy:
    if: github.repository == 'lewdoherz/GrowthFun' && github.event_name != 'pull_request' && github.ref == 'refs/heads/public-preview'
    needs: verify-preview
    runs-on: ubuntu-latest
    concurrency:
      group: growthfun-informational-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy informational site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
